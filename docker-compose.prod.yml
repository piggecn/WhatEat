# 生产部署专用：只拉镜像，不在服务器构建
# 使用方式：
#   docker login [你的镜像仓库地址]   # Docker Hub 用户无需加地址
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# 升级版本：
#   docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d

services:
  what-to-eat-today:
    # ===== 三选一，把不需要的注释掉 =====
    # 1) Docker Hub
    image: your-dockerhub-user/what-to-eat-today:latest
    # 2) 阿里云 ACR 示例
    # image: registry.cn-hangzhou.aliyuncs.com/your-namespace/what-to-eat-today:latest
    # 3) 自建 Harbor 示例
    # image: harbor.your-domain.com/library/what-to-eat-today:latest

    container_name: what-to-eat-today
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - recipe_data:/app/data
    # 域名 / CORS / API 等一律在 Web 端「管理中心 → 系统设置」里配置，无需改本文件
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:8765/api/system/settings').read() or sys.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  recipe_data:
