services:
  whateat:
    build: .
    image: whateat:latest
    container_name: whateat
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - recipe_data:/app/data
    environment:
      APP_VERSION: "0.0.1"
    init: true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8765/', timeout=4).status < 400 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  recipe_data:
