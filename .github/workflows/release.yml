name: release

# 发布：推送 tag（v*）→ 构建并推送 Docker 镜像（版本 tag + latest）→
# GitHub 上自动构建 APK（版本号跟随 tag、签名密钥来自 Secrets）→
# 创建 GitHub Release 并把 whateat.apk 挂上去，壳的自更新即走此 Release。
# 打 tag 可用本地工具：tools\release-tag.bat
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装构建组件
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "build-tools;36.0.0" "platforms;android-34" > /dev/null

      - name: 构建 APK
        env:
          KEYSTORE_B64: ${{ secrets.WHATEAT_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.WHATEAT_KEYSTORE_PASS }}
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          IFS='.' read -ra P <<< "$TAG"
          VC=$(( ${P[0]} * 10000 + ${P[1]} * 100 + ${P[2]} ))
          echo "APK 版本: $TAG (versionCode $VC)"
          VERSION_NAME="$TAG" VERSION_CODE="$VC" bash android/build-apk-ci.sh

      - name: 上传 APK 构件
        uses: actions/upload-artifact@v4
        with:
          name: whateat-apk
          path: android/whateat.apk
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: apk
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载 APK 构件
        uses: actions/download-artifact@v4
        with:
          name: whateat-apk
          path: ./dist

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/whateat:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/whateat:latest

      - name: 创建 GitHub Release（附 APK）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          files: dist/whateat.apk
